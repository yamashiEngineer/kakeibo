<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>収支フォーム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4" style="max-width: 500px;">
<h2 class="mb-4" th:text="${transaction.id == null ? '収支登録' : '収支編集'}"></h2>
<form th:action="${transaction.id == null ? '/transactions' : '/transactions/' + transaction.id}" th:object="${transaction}" method="post">
    <div class="mb-3">
        <label class="form-label">種別</label><br>
        <input type="radio" th:field="*{type}" value="expense" id="exp" checked> <label for="exp">支出</label>
        <input type="radio" th:field="*{type}" value="income" id="inc"> <label for="inc">収入</label>
    </div>
    <div class="mb-3">
        <label class="form-label">日付</label>
        <input type="date" th:field="*{txnDate}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">カテゴリ</label>
        <input type="text" th:field="*{category}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">金額</label>
        <input type="number" th:field="*{amount}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">メモ</label>
        <input type="text" th:field="*{memo}" class="form-control">
    </div>
    <button type="submit" class="btn btn-success">保存</button>
    <a th:href="@{/transactions}" class="btn btn-secondary">キャンセル</a>
</form>
</body>
</html>
