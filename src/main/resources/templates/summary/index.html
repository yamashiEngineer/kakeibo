<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>月別集計</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4" style="max-width: 700px;">
<div class="d-flex justify-content-between mb-3">
    <h1>月別集計</h1>
    <a th:href="@{/transactions}" class="btn btn-secondary">一覧に戻る</a>
</div>
<table class="table table-bordered text-center">
    <thead class="table-dark">
    <tr>
        <th>月</th><th>収入合計</th><th>支出合計</th><th>収支</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="s : ${summaryList}">
        <td th:text="${s.month}"></td>
        <td th:text="${#numbers.formatInteger(s.totalIncome, 1, 'COMMA')} + '円'" class="text-success"></td>
        <td th:text="${#numbers.formatInteger(s.totalExpense, 1, 'COMMA')} + '円'" class="text-danger"></td>
        <td th:text="${(s.balance >= 0 ? '+' : '') + #numbers.formatInteger(s.balance, 1, 'COMMA')} + '円'"
            th:class="${s.balance >= 0 ? 'text-primary fw-bold' : 'text-danger fw-bold'}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
